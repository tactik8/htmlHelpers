   :root {

            --bs-primary: #ff5733;

            --bs-success: #28a745;

            /* 2. The RGB equivalents (Crucial for Bootstrap 5.3 utilities) */
            /* You can get these numbers by converting your hex to rgb */
            --bs-primary-rgb: 255, 87, 51;     /* #ff5733 */
            --bs-secondary-rgb: 51, 255, 209;  /* #33ffd1 */
            --bs-success-rgb: 40, 167, 69;     /* #28a745 */
        }
    </style>
</head>
